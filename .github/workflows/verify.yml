name: verify

on:
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Web tests
        working-directory: web
        run: npx vitest run

      - name: Type-check
        working-directory: web
        run: npx svelte-check --tsconfig ./tsconfig.json
