[project]
name = "fantasy-platform"
version = "0.1.0"
description = "Fantasy football data platform — Python API + ingestion over a private Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

# This is an application, not a library — don't build/install the project itself,
# just its dependencies. We run it with PYTHONPATH=src. Keeps uv and pip in sync.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
