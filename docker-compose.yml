# Local Postgres only. Bound to 127.0.0.1 so it mirrors the "private DB" model —
# no public exposure. On Railway this is replaced by a private Postgres plugin;
# the application code is identical and just reads DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
